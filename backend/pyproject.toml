[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "fittrack-backend"
version = "0.1.0"
description = "API local inicial de FitTrack"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.0.58",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.3",
    "email-validator==2.4.0",
    "PyJWT==2.15.1",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "httpx2==2.16.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
